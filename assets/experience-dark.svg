<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="03 / Experience — Nine years, five teams."><title>03 / Experience — Nine years, five teams.</title><style>@font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:D;src:url(data:font/woff2;base64,) format('woff2')}svg{shape-rendering:geometricPrecision}.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade 1.2s ease both}@keyframes up{from{opacity:0;transform:translateY(24px)}}@keyframes fade{from{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3);opacity:0}}@keyframes draw{from{stroke-dashoffset:var(--len)}}@keyframes float{50%{transform:translateY(-8px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.rule{stroke-dasharray:var(--len);--len:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) .2s both}</style><g class="up"><text x="4.0" y="30.0" font-family="M" font-size="14" fill="#ff7a2f" text-anchor="start" letter-spacing="2.4">03 / EXPERIENCE</text></g><line class="rule" x1="182" y1="25" x2="996" y2="25" stroke="#3a302a" stroke-width="1.5"/><g class="up" style="animation-delay:.15s"><text x="0.0" y="92.0" font-family="D" font-size="44" fill="#f5ede0" text-anchor="start" letter-spacing="-1">Nine years, five teams.</text></g></svg>